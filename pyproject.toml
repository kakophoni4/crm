[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-chat-center"
version = "0.1.0"
description = "CRM Chat Center backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111,<0.137",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "sentry-sdk>=2.5",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<4.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx-ws>=0.6",
    "ruff>=0.4",
    "mypy>=1.10",
    "testcontainers[postgresql,redis]>=4.4",
    "docker>=7.1",
    "types-passlib>=1.7",
    "schemathesis>=4.18",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008"]
"tests/conftest.py" = ["E402"]
"tests/statuses/**" = ["RUF001"]
"app/modules/contacts/activity_timeline.py" = ["RUF001"]
"tests/contacts/test_contact_activity_timeline.py" = ["RUF001"]
"alembic/versions/0007_statuses.py" = ["RUF001"]
"alembic/versions/0019_leads.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true
