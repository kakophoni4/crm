# Local Telegram Bot API — allows inbound files up to ~2 GB (CRM caps at 100 MB).
# Cloud api.telegram.org hard-limits bot downloads at ~20 MB.
#
# Requires TELEGRAM_API_ID + TELEGRAM_API_HASH from https://my.telegram.org
#
# Usage (on VPS):
#   export TELEGRAM_API_ID=...
#   export TELEGRAM_API_HASH=...
#   docker compose -f deploy/server/docker-compose.telegram-bot-api.yaml up -d
#   bash scripts/bots/tg_crm_bridge/install-local-bot-api.sh

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: crm-telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID from my.telegram.org}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH from my.telegram.org}
      # Keep HTTP file URLs (do not enable TELEGRAM_LOCAL) so CRM worker can download.
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/ || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  telegram-bot-api-data:
