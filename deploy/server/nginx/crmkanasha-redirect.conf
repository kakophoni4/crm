# HTTP → HTTPS redirect (enable after SNI split + certs are working).
# install-sni-split.sh copies this over crmkanasha.conf in the final step.

server {
    listen 80;
    server_name app.crmkanasha.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name api.crmkanasha.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
