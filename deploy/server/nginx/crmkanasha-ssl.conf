# CRM HTTPS — terminates TLS on localhost:8443 (reached via stream SNI split on :443).
# Cert path: certbot -d app.crmkanasha.org -d api.crmkanasha.org
#   → /etc/letsencrypt/live/app.crmkanasha.org/{fullchain.pem,privkey.pem}

server {
    listen 127.0.0.1:8443 ssl;
    server_name app.crmkanasha.org;

    ssl_certificate     /etc/letsencrypt/live/app.crmkanasha.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.crmkanasha.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:19090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name api.crmkanasha.org;

    ssl_certificate     /etc/letsencrypt/live/app.crmkanasha.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.crmkanasha.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:19001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /green/ {
        proxy_pass http://127.0.0.1:8766/green/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
