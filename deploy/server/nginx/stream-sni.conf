# SNI split on public :443 — TCP passthrough, no TLS termination here.
#
#   app.crmkanasha.org / api.crmkanasha.org  →  nginx TLS on 127.0.0.1:8443
#   everything else (xray REALITY / xHTTP)   →  127.0.0.1:10443
#
# Requires: xray inbound listen 127.0.0.1:10443 (NOT 0.0.0.0:443).
# Include from nginx.conf: stream { include /etc/nginx/stream.conf.d/*.conf; }

map $ssl_preread_server_name $sni_backend {
    app.crmkanasha.org    crm_ssl;
    api.crmkanasha.org    crm_ssl;
    default               xray;
}

upstream crm_ssl {
    server 127.0.0.1:8443;
}

upstream xray {
    server 127.0.0.1:10443;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $sni_backend;
    proxy_connect_timeout 10s;
    proxy_timeout 86400s;
}
