# Vaultwarden HTTP :80 — ACME webroot + redirect to HTTPS (after install-bitwarden.sh).

server {
    listen 80;
    server_name vault.crmkanasha.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
