# Vaultwarden HTTPS — terminates TLS on 127.0.0.1:8443 (SNI split on public :443).
# Requires: vaultwarden on 127.0.0.1:19180, cert with vault.crmkanasha.org SAN.
# Cert path: same as CRM — /etc/letsencrypt/live/app.crmkanasha.org/

server {
    listen 127.0.0.1:8443 ssl;
    server_name vault.crmkanasha.org;

    ssl_certificate     /etc/letsencrypt/live/app.crmkanasha.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.crmkanasha.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:19180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /notifications/hub {
        proxy_pass http://127.0.0.1:19180;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }
}
