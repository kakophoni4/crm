[global]
type=global
user_agent=CRM-Asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

[webrtc-endpoint](!)
type=endpoint
transport=transport-ws
context=crm-internal
disallow=all
allow=opus,ulaw,alaw
webrtc=yes
use_avpf=yes
media_encryption=dtls
dtls_auto_generate_cert=yes
dtls_verify=no
dtls_setup=actpass
ice_support=yes
rtcp_mux=yes
direct_media=no

; Smoke-test extension. Real operator extensions are issued by CRM and must be
; synced into this file or a generated include before enabling production calls.
[7001](webrtc-endpoint)
auth=7001
aors=7001
callerid=CRM WebRTC 7001 <7001>

[7001]
type=auth
auth_type=userpass
username=7001
password=dev-webrtc-7001

[7001]
type=aor
max_contacts=1
remove_existing=yes

#include pjsip.generated.conf
