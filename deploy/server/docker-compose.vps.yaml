# VPS overlay: old CPU MinIO, localhost-only ports, no Traefik.
# Usage:
#   docker compose -f docker/docker-compose.staging.yaml \
#     -f deploy/server/docker-compose.vps.yaml \
#     --env-file deploy/.env.staging up -d

services:
  minio:
    image: minio/minio:RELEASE.2023-12-02T10-51-33Z-cpuv1
    healthcheck:
      disable: true

  minio-init:
    image: minio/mc:RELEASE.2023-09-13T23-08-58Z
    depends_on:
      minio:
        condition: service_started

  api:
    ports:
      - "172.17.0.1:19001:8000"

  frontend:
    ports:
      - "172.17.0.1:19090:80"

  worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
