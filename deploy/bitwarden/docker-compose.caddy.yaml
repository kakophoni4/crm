# Vaultwarden via matrix-caddy (same pattern as chat/api on this VPS).
# Caddy: reverse_proxy host.docker.internal:19180
# Port must be 0.0.0.0:19180 (NOT 127.0.0.1) so Caddy can reach via host.docker.internal.
#
#   cd /opt/vaultwarden
#   docker compose -f docker-compose.caddy.yaml --env-file .env up -d
#
# Caddyfile block (in /opt/matrix/data/caddy/Caddyfile):
#   huitawarden.bttsrvvrs.org {
#     reverse_proxy host.docker.internal:19180
#   }

name: vaultwarden

services:
  vaultwarden:
    image: vaultwarden/server:1.34.3-alpine
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-false}
      INVITATIONS_ALLOWED: ${INVITATIONS_ALLOWED:-true}
      ROCKET_PORT: 80
    volumes:
      - vaultwarden-data:/data
    ports:
      - "19180:80"

volumes:
  vaultwarden-data:
