# Vaultwarden behind existing CRM Traefik (ports 80/443 already taken).
# Does NOT use host nginx. CRM containers are not restarted.
#
#   cd /opt/vaultwarden
#   docker compose -f docker-compose.traefik.yaml --env-file .env up -d
#
# Requires: crm-staging-traefik running, network crm-staging-net

name: vaultwarden

services:
  vaultwarden:
    image: vaultwarden/server:1.34.3-alpine
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-false}
      INVITATIONS_ALLOWED: ${INVITATIONS_ALLOWED:-true}
      SHOW_PASSWORD_HINT: ${SHOW_PASSWORD_HINT:-false}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      EXTENDED_LOGGING: ${EXTENDED_LOGGING:-false}
      ROCKET_PORT: 80
    volumes:
      - vaultwarden-data:/data
    networks:
      - crm-staging-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=crm-staging-net
      - traefik.http.routers.vaultwarden.rule=Host(`huitawarden.bttsrvvrs.org`)
      - traefik.http.routers.vaultwarden.entrypoints=websecure
      - traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt
      - traefik.http.services.vaultwarden.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  crm-staging-net:
    external: true

volumes:
  vaultwarden-data:
