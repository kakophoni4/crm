name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CRM_TEST_USE_LOCAL: "1"
      DATABASE_URL: postgresql+asyncpg://crm:crm@localhost:5432/crm
      REDIS_URL: redis://localhost:6379/0
      OWNERSHIP_V2: "true"
      JWT_SECRET: test_jwt_secret_with_minimum_32_chars
      PGCRYPTO_KEY: test_fixture_pgcrypto_key_32chars_min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Migrate
        run: alembic upgrade head
      - name: Pytest
        run: pytest -q
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  # Verify Dockerfiles on PR only (no registry push; images built on main in docker-build.yml).
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          load: true
          tags: crm-api:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          load: true
          tags: crm-worker:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          load: true
          tags: crm-frontend:local
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000/api/v1
            VITE_WS_URL=ws://localhost:8000/ws
          cache-from: type=gha
          cache-to: type=gha,mode=max
