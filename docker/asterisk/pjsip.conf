[global]
type=global
user_agent=CRM-Asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

[webrtc-endpoint](!)
type=endpoint
transport=transport-wss
context=crm-internal
disallow=all
allow=opus,ulaw,alaw
webrtc=yes
use_avpf=yes
media_encryption=dtls
dtls_auto_generate_cert=yes
dtls_verify=no
dtls_setup=actpass
ice_support=yes
rtcp_mux=yes
direct_media=no

[7001](webrtc-endpoint)
auth=7001
aors=7001
callerid=CRM WebRTC 7001 <7001>

[7001]
type=auth
auth_type=userpass
username=7001
password=dev-webrtc-7001

[7001]
type=aor
max_contacts=1
remove_existing=yes

; Bitcall trunk goes here after provider credentials are copied from CRM storage
; into an Asterisk config/backend that is not exposed to the browser.
