# Dev-only stack: dependencies for CRM Chat Center (no app container).
# Postgres/Redis ports are published to the host for local IDE runs — do NOT expose them in production.

name: crm-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      # Dev only — in production do not publish Postgres to the host.
      # Host port 5433 to avoid conflict with locally-installed PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - crm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    ports:
      # Dev only — in production do not publish Redis to the host.
      - "6379:6379"
    networks:
      - crm-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: crm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniominio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - crm-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  crm-minio-init:
    image: minio/mc:latest
    container_name: crm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - crm-net
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://crm-minio:9000 minio miniominio &&
      mc mb myminio/crm-files --ignore-existing &&
      mc mb myminio/crm-backups --ignore-existing &&
      echo 'MinIO buckets ready: crm-files, crm-backups'
      "
    restart: "no"

  adminer:
    image: adminer:latest
    container_name: crm-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: crm-postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm-net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: crm-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - crm-net

  asterisk:
    build:
      context: .
      dockerfile: asterisk/Dockerfile
    container_name: crm-asterisk
    restart: unless-stopped
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "8088:8088"
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./asterisk:/etc/asterisk:ro
    networks:
      - crm-net

  # Run from repo root with deps installed: pip install -e ".[dev]"
  crm-worker:
    image: python:3.12-slim
    container_name: crm-worker
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://crm:crm@crm-postgres:5432/crm
      REDIS_URL: redis://crm-redis:6379/0
      OWNERSHIP_V2: "true"
      JWT_SECRET: changeme_dev_secret_min_32_chars_xxxxxx
      PGCRYPTO_KEY: changeme_dev_pgcrypto_key
    command: sh -c "pip install -e '.[dev]' && python -m app.workers.run"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm-net

networks:
  crm-net:
    name: crm-net

volumes:
  pgdata:
    name: crm-pgdata
  miniodata:
    name: crm-miniodata
