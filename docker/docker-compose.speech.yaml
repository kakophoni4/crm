# Add this file to the same Compose invocation used for the CRM stack.
services:
  api:
    environment:
      SPEECH_SERVICE_URL: http://speech:8090
    networks:
      - crm-staging-net
      - speech-private
  speech:
    build:
      context: ..
      dockerfile: deploy/speech/Dockerfile
    restart: unless-stopped
    networks: [speech-private]
    mem_limit: 2g
    cpus: 2
    read_only: true
    tmpfs: [/tmp:size=128m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
networks:
  speech-private:
    internal: true
