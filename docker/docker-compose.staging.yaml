# CRM Chat Center — staging stack (Traefik TLS + app images + data stores).
#
# VPS (Traefik + Let's Encrypt staging CA):
#   cp deploy/env.staging.example deploy/.env.staging
#   # edit secrets + DOMAIN, ACME_EMAIL
#   docker compose -f docker/docker-compose.staging.yaml --env-file deploy/.env.staging \
#     --profile with-proxy up -d --build
#
# Local smoke (no Traefik, HTTP on host):
#   docker compose -f docker/docker-compose.staging.yaml -f docker/docker-compose.local.yaml \
#     --env-file deploy/.env.staging up -d --build
#
# Optional monitoring:
#   docker compose -f docker/docker-compose.staging.yaml -f docker/docker-compose.monitoring.yaml \
#     --env-file deploy/.env.staging --profile with-proxy up -d
#
# Postgres/Redis are NOT published to the host (internal network only).

name: crm-staging

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-staging}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-https://chat.${DOMAIN}}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  PGCRYPTO_KEY: ${PGCRYPTO_KEY:?PGCRYPTO_KEY is required}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crm}}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  OWNERSHIP_V2: ${OWNERSHIP_V2:-true}
  WORKERS_IN_API: "false"
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  S3_BUCKET_FILES: ${S3_BUCKET_FILES:-crm-files}
  S3_BUCKET_BACKUPS: ${S3_BUCKET_BACKUPS:-crm-backups}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-staging}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
  LOG_JSON: ${LOG_JSON:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_FROM: ${SMTP_FROM:-no-reply@${DOMAIN}}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  WA_BRIDGE_SYNC_SECRET: ${WA_BRIDGE_SYNC_SECRET:-changeme_wa_bridge_sync_secret_min32}
  WA_BRIDGE_WEBHOOK_PUBLIC_BASE: ${WA_BRIDGE_WEBHOOK_PUBLIC_BASE:-https://api.${DOMAIN}/green/webhook}
  WA_BRIDGE_OUTBOUND_URL: ${WA_BRIDGE_OUTBOUND_URL:-http://host.docker.internal:8766/crm/cmd}
  WA_BRIDGE_HEALTH_URL: ${WA_BRIDGE_HEALTH_URL:-http://host.docker.internal:8766/crm/health}
  TELEPHONY_STUN_URLS: ${TELEPHONY_STUN_URLS:-stun:stun.l.google.com:19302}
  TELEPHONY_TURN_URLS: ${TELEPHONY_TURN_URLS:-}
  TELEPHONY_TURN_USERNAME: ${TELEPHONY_TURN_USERNAME:-}
  TELEPHONY_TURN_PASSWORD: ${TELEPHONY_TURN_PASSWORD:-}
  MOLE_API_BASE_URL: ${MOLE_API_BASE_URL:-}
  MOLE_API_ORDERS_PATH: ${MOLE_API_ORDERS_PATH:-/hs/mole/orders}
  MOLE_API_TIMEOUT_SECONDS: ${MOLE_API_TIMEOUT_SECONDS:-60}
  MOLE_API_USERNAME: ${MOLE_API_USERNAME:-}
  MOLE_API_PASSWORD: ${MOLE_API_PASSWORD:-}
  OPT_VAT_RATE_PERCENT: ${OPT_VAT_RATE_PERCENT:-20}

services:
  traefik:
    image: traefik:v3.3
    container_name: crm-staging-traefik
    profiles: [with-proxy, local-staging]
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=crm-staging-net
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required with with-proxy profile}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - crm-staging-net

  postgres:
    image: postgres:16-alpine
    container_name: crm-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    volumes:
      - staging-pgdata:/var/lib/postgresql/data
    networks:
      - crm-staging-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: crm-staging-redis
    restart: unless-stopped
    networks:
      - crm-staging-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: crm-staging-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - staging-miniodata:/data
    networks:
      - crm-staging-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    container_name: crm-staging-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - crm-staging-net
    entrypoint: >
      /bin/sh -c "
      mc alias set crm http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb crm/$${S3_BUCKET_FILES} --ignore-existing &&
      mc mb crm/$${S3_BUCKET_BACKUPS} --ignore-existing &&
      echo 'MinIO buckets ready'
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      S3_BUCKET_FILES: ${S3_BUCKET_FILES:-crm-files}
      S3_BUCKET_BACKUPS: ${S3_BUCKET_BACKUPS:-crm-backups}
    restart: "no"

  api:
    image: ${CRM_API_IMAGE:-crm-api:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: crm-staging-api
    restart: unless-stopped
    environment:
      <<: *api-env
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        echo "Running database migrations..."
        alembic upgrade head
        echo "Starting API..."
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm-staging-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    labels:
      - traefik.enable=true
      - traefik.docker.network=crm-staging-net
      - traefik.http.routers.crm-api.rule=Host(`api.${DOMAIN:?DOMAIN is required}`)
      - traefik.http.routers.crm-api.entrypoints=websecure
      - traefik.http.routers.crm-api.tls.certresolver=letsencrypt
      - traefik.http.services.crm-api.loadbalancer.server.port=8000

  # GREEN API inbound webhooks — bridge runs on host (systemd), not in this compose stack.
  wa-bridge-proxy:
    image: nginx:1.27-alpine
    container_name: crm-staging-wa-bridge-proxy
    profiles: [with-proxy, local-staging]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../deploy/traefik/wa-bridge-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - crm-staging-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=crm-staging-net
      - traefik.http.routers.crm-wa-green.rule=Host(`api.${DOMAIN:?DOMAIN is required}`) && PathPrefix(`/green`)
      - traefik.http.routers.crm-wa-green.entrypoints=websecure
      - traefik.http.routers.crm-wa-green.tls.certresolver=letsencrypt
      - traefik.http.routers.crm-wa-green.priority=100
      - traefik.http.services.crm-wa-green.loadbalancer.server.port=80

  worker:
    image: ${CRM_WORKER_IMAGE:-crm-worker:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: crm-staging-worker
    restart: unless-stopped
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - crm-staging-net

  frontend:
    image: ${CRM_FRONTEND_IMAGE:-crm-frontend:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.${DOMAIN}/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-wss://api.${DOMAIN}/api/v1/ws}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-staging}
    container_name: crm-staging-frontend
    restart: unless-stopped
    networks:
      - crm-staging-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=crm-staging-net
      - traefik.http.routers.crm-app.rule=Host(`app.${DOMAIN}`)
      - traefik.http.routers.crm-app.entrypoints=websecure
      - traefik.http.routers.crm-app.tls.certresolver=letsencrypt
      - traefik.http.services.crm-app.loadbalancer.server.port=80

networks:
  crm-staging-net:
    name: crm-staging-net

volumes:
  staging-pgdata:
    name: crm-staging-pgdata
  staging-miniodata:
    name: crm-staging-miniodata
  traefik-letsencrypt:
    name: crm-staging-traefik-le
