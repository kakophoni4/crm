# CRM Chat Center — Prometheus (dev).
# Alerts are evaluated here; on dev there is no Alertmanager (rules visible in UI / logs only).
# Production: add alertmanager target under alerting.alertmanagers (phase 7).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Dev: no Alertmanager — firing alerts appear at http://localhost:9090/alerts only.
alerting:
  alertmanagers: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: crm-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api-metrics:8000"]
        labels:
          service: crm-api

  # Optional: uncomment when redis_exporter is added to the stack.
  # - job_name: redis
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
