# Production/staging Prometheus — Alertmanager wired.
# Mount via docker-compose.monitoring.prod.yaml.example (or deploy/ copy).
# Scrape target `api:8000` is the CRM API container from staging/prod compose (not api-metrics).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/alerts.smoke.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: crm-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: crm-api
